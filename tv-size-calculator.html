              />
            </svg>
          </span>
          <span class="lgtv__toggle-text"
            >Подобрать диагональ ТВ по расстоянию</span
          >
        </div>

        <button
          type="button"
          class="lgtv__toggle"
          data-lgtv="toggle"
          aria-expanded="false"
        >
          <span class="lgtv__toggle-btn-text">Подобрать</span>
          <span
            class="lgtv__toggle-chevron"
            data-lgtv="chevron"
            aria-hidden="true"
          >
            <svg viewBox="0 0 16 10" width="14" height="9" fill="none">
              <path

                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </span>

      <div class="lgtv__panel" data-lgtv="panel">
        <div class="lgtv__panel-inner">
          <div class="lgtv__media">

            <video

              data-lgtv="bg-video"

              data-mobile-src="https://www.lg.com/content/dam/channel/wcms/kz/images/tvs-soundbars/tv-buying-guide/tv-recommendation-14-inch-recommendation-m.mp4"
              muted
              loop
              playsinline
              aria-hidden="true"

            <div class="lgtv__content">
              <div class="lgtv__inner">

                  <span class="lgtv__kicker">Подбор диагонали</span>
                  <h2 class="lgtv__title">Не уверены<br />в размере ТВ?</h2>
                  <p class="lgtv__sub">

                </div>

                <div class="lgtv__col lgtv__col--ruler">

                      class="lgtv__nudge lgtv__nudge--l"

                      −
                    </button>

                      class="lgtv__tape"
                      data-lgtv="track"
                      role="slider"
                      tabindex="0"
                      aria-label="Расстояние до ТВ"
                      aria-valuemin="1"
                      aria-valuemax="4"
                      aria-valuenow="2"
                    >
                      <svg
                        class="lgtv__ticks"
                        data-lgtv="ticks"
                        viewBox="0 0 100 28"
                        preserveAspectRatio="none"
                        aria-hidden="true"
                      ></svg>
                      <div class="lgtv__tape-fill" data-lgtv="track-fill"></div>
                      <div class="lgtv__tag" data-lgtv="handle"></div>
                    </div>

                    <button
                      type="button"
                      class="lgtv__nudge lgtv__nudge--r"
                      data-lgtv="inc"
                      aria-label="Увеличить расстояние"
                    >
                      +
                    </button>
                  </div>

                  <div class="lgtv__scale" data-lgtv="scale"></div>
                </div>

                <div class="lgtv__col lgtv__col--result">
                  <div class="lgtv__result">
                    <svg
                      class="lgtv__tv-icon"
                      data-lgtv="tv-icon"
                      viewBox="0 0 64 64"
                      fill="none"
                      aria-hidden="true"

                        fill-rule="evenodd"
                        clip-rule="evenodd"

                        fill="#000"

                      >55</span
                    >″ ТВ</a
                  >
                  <a
                    href="https://www.lg.com/kz/buying-guides/tv-lineup-guide/"
                    class="lgtv__more"
                    >Подробнее</a
                  >
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      (function () {
        function injectStyles() {
          if (document.getElementById("lgtv-styles")) return;
          var style = document.createElement("style");
          style.id = "lgtv-styles";
          style.textContent = LGTV_CSS;
          document.head.appendChild(style);
        }

        var LGTV_CSS = `
  .lgtv{
    --lg-paper:#efe9dd;
    --lg-ink:#161513;
    --lg-red:#ea1917;
    --lg-line: rgba(22,21,19,.16);
    --lg-text-dim:#6b675f;
    --lg-mono: "Roboto Mono","SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
    font-family: "LG Smart UI","Helvetica Neue",Helvetica,Arial,sans-serif;
    color: var(--lg-ink);
    box-sizing: border-box;
    max-width: 1240px;
    margin: 0 auto;
  }
  .lgtv *{ box-sizing:border-box; }

  /* ---- Media area: lives INSIDE the collapsible panel, video + calculator together.
         Collapsed = not rendered (0 height), so no video plays behind the closed bar. ---- */
  .lgtv .lgtv__media{
    position: relative;
    overflow: hidden;
    border-radius: 1rem;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    min-height: 420px;
  }

  .lgtv .lgtv__bg-video{
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 0;
    pointer-events: none;
  }

  /* ---- Content: left on desktop (animation lives on the right of the video),
         top on mobile (animation lives at the bottom of the video).
         Sits directly on top of the video, no background/shadow of its own. ---- */
  .lgtv .lgtv__content{
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 46%;
    margin: 32px 0 32px 40px;
  }

  /* ---- Bar: label + toggle button (sits above the panel, no video/card here) ---- */
  .lgtv .lgtv__bar{
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    padding: 18px 22px; flex-wrap:wrap;
  }
  .lgtv .lgtv__bar-label{
    display:flex; align-items:center; gap:12px;
  }
  .lgtv .lgtv__toggle-icon{ display:flex; align-items:center; flex:none; }
  .lgtv .lgtv__toggle-text{ font-size:15px; font-weight:700; color: var(--lg-ink); }

  .lgtv .lgtv__toggle{
    display:inline-flex; align-items:center; gap:10px;
    background: var(--lg-red);
    border: 1px solid var(--lg-red);
    border-radius: 0.5rem;
    padding: 12px 18px;
    cursor:pointer;
    font-family: inherit;
    color: #fff;
    flex:none;
    transition: background .15s ease, color .15s ease, border-color .15s ease;
  }
  .lgtv .lgtv__toggle:hover{ background:#fff; color: #000; border-color: #000}
  .lgtv .lgtv__toggle-btn-text{ font-size:14px; font-weight:700; white-space:nowrap; }
  .lgtv .lgtv__toggle-chevron{
    color: inherit; flex:none; line-height:1;
    display:flex; align-items:center; justify-content:center;
    transition: transform .25s cubic-bezier(.22,.61,.36,1);
  }
  .lgtv .lgtv__toggle[aria-expanded="true"] .lgtv__toggle-chevron{
    transform: rotate(180deg);
  }

  /* ---- Collapsible panel ---- */
  .lgtv .lgtv__panel{
    display:grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows .45s cubic-bezier(.16,1,.3,1);
  }
  .lgtv .lgtv__panel[data-open="true"]{
    grid-template-rows: 1fr;
  }
  .lgtv .lgtv__panel-inner{
    overflow:hidden;
    min-height:0;
  }

  /* ---- Inner content: single column (compact card layout) ---- */
  .lgtv .lgtv__inner{
    display:grid;
    grid-template-columns: 1fr;
    row-gap: 26px;
    padding: 4px 22px 26px;
  }

  /* ---- Col 1 ---- */
  .lgtv .lgtv__kicker{
    display:inline-block; font-size:11px; letter-spacing:.14em; text-transform:uppercase;
    color: var(--lg-red); font-weight:700; margin-bottom:12px;
  }
  .lgtv .lgtv__title{
    font-size: 26px; line-height:1.15; font-weight:800; letter-spacing:-0.015em; margin:0 0 10px;
  }
  .lgtv .lgtv__sub{
    font-size: 14px; line-height:1.55; color: var(--lg-text-dim); margin:0;
  }

  /* ---- Col 2: ruler ---- */
  .lgtv .lgtv__ruler-head{
    display:flex; align-items:baseline; justify-content:space-between; margin-bottom: 18px; gap:12px; flex-wrap:wrap;
  }
  .lgtv .lgtv__label{
    font-size: 13px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; margin:0;
  }
  .lgtv .lgtv__readout{
    font-size: 26px; font-weight:700; letter-spacing:-0.01em;
  }

  .lgtv .lgtv__tape-wrap{ display:flex; align-items:center; gap:14px; }
  .lgtv .lgtv__nudge{
    appearance:none; border:1.5px solid var(--lg-ink); background:transparent; color: var(--lg-ink);
    width:30px; height:30px; border-radius:50%; font-size:17px; line-height:1; cursor:pointer; flex:none;
    display:flex; align-items:center; justify-content:center; transition: background .15s ease, color .15s ease;
  }
  .lgtv .lgtv__nudge:hover{ background: var(--lg-red); color:#fff; }

  .lgtv .lgtv__tape{
    position:relative; flex:1; height:54px; cursor:pointer; touch-action:none;
  }
  .lgtv .lgtv__ticks{ position:absolute; inset:0; width:100%; height:100%; }
  .lgtv .lgtv__tape-fill{
    position:absolute; left:0; bottom:0; height:2px; background: var(--lg-ink);
    transition: width .45s cubic-bezier(.16,1,.3,1);
  }
  .lgtv .lgtv__tag{
    position:absolute; bottom:-2px; width:3px; height:30px; background: var(--lg-red);
    transform: translateX(-50%); transition: left .45s cubic-bezier(.16,1,.3,1);
  }
  .lgtv .lgtv__tag::before{
    content:""; position:absolute; top:-10px; left:50%; transform:translateX(-50%);
    width:11px; height:11px; border-radius:50%; background: var(--lg-red);
  }
  .lgtv .lgtv__tag.is-dragging{ transition:none; }

  .lgtv .lgtv__scale{
    display:flex; justify-content:space-between; margin-top:10px;
    font-size:11.5px; color: var(--lg-text-dim); padding:0 40px;
  }

  /* ---- Col 3: result ---- */
  .lgtv .lgtv__col--result{ display:flex; flex-direction:column; align-items:flex-start; gap:16px; }
  .lgtv .lgtv__result{
    display:flex; align-items:center; gap:16px; padding-bottom:16px; border-bottom:1px solid var(--lg-line); width:100%;
  }
  .lgtv .lgtv__tv-icon{ width:70px; height:auto; flex:none; transition: transform .45s cubic-bezier(.16,1,.3,1); }
  .lgtv .lgtv__result-text{ display:flex; flex-direction:column; }
  .lgtv .lgtv__result-label{ font-size:12px; color: var(--lg-text-dim); margin-bottom:2px; }
  .lgtv .lgtv__result-size{ font-size:32px; font-weight:700; line-height:1; }

  .lgtv .lgtv__cta{
    appearance:none; border:none; background: var(--lg-red); color:#fff; font-size:14px; font-weight:700;
    padding: 13px 22px; border-radius: 0.5rem; cursor:pointer; white-space:nowrap;
    display:inline-flex; align-items:center; justify-content:center; text-decoration:none;
    transition: all .15s ease;
  }
  .lgtv .lgtv__cta:hover{ background: #fff; color: #000;}

  .lgtv .lgtv__more{
    font-size:12.5px; color: var(--lg-ink); text-decoration: underline; text-underline-offset:3px;
  }
  .lgtv .lgtv__more:hover{ color: var(--lg-red); }

  /* ---- Mobile: card sits at the top, video keeps its own 720x1080 ratio so the
         bottom of the video (animation) stays visible and isn't covered. ---- */
  @media (max-width: 980px){
    .lgtv .lgtv__media{
      flex-direction: column;
      align-items: stretch;
      justify-content: flex-start;
      aspect-ratio: 720 / 1080;
      min-height: auto;
      border-radius: 0;
    }
    .lgtv .lgtv__content{
      max-width: none;
      max-height: 400px;
      overflow-y: auto;
      margin: 20px 16px 0;
    }
    .lgtv .lgtv__bar{ justify-content:center; text-align:center; }
    .lgtv .lgtv__col--text{ text-align:center; }
    .lgtv .lgtv__ruler-head{ justify-content:center; text-align:center; }
    .lgtv .lgtv__col--result{ align-items:center; }
    .lgtv .lgtv__result{ justify-content:center; }
    .lgtv .lgtv__cta{ width:100%; justify-content:center; }
  }

              ticksSvg.appendChild(line);
            }
          })();

          scaleEl.innerHTML = "";
          SCALE_STEPS.forEach(function (m) {
            var span = document.createElement("span");
            span.textContent = formatMeters(m) + "м";
            scaleEl.appendChild(span);
          });

          function valueToPct(v) {
            return (v - MIN_M) / (MAX_M - MIN_M);
          }

          function render() {
            var pct = valueToPct(value) * 100;
            handle.style.left = pct + "%";
            fill.style.width = pct + "%";
            track.setAttribute("aria-valuenow", formatMeters(value));
            if (readoutVal) readoutVal.textContent = formatMeters(value);

            var size = recommendedSize(value);
            if (recSize) recSize.textContent = size;
            if (ctaSize) ctaSize.textContent = size;
            if (ctaLink) ctaLink.href = SIZE_LINKS[size] || "#";

            if (tvIcon) {
              var scale = 0.6 + ((size - 32) / (98 - 32)) * 0.55;
              tvIcon.style.transform = "scale(" + scale.toFixed(2) + ")";
            }
          }

          function setValueFromClientX(clientX) {
            var rect = track.getBoundingClientRect();
            var pct = clamp((clientX - rect.left) / rect.width, 0, 1);
            var raw = MIN_M + pct * (MAX_M - MIN_M);
            var stepped = Math.round(raw / STEP_M) * STEP_M;
            value = clamp(parseFloat(stepped.toFixed(2)), MIN_M, MAX_M);
            render();
          }

          var dragging = false;
          function onDown(e) {
            dragging = true;
            handle.classList.add("is-dragging");
            var x = e.touches ? e.touches[0].clientX : e.clientX;
            setValueFromClientX(x);
            e.preventDefault();
          }
          function onMove(e) {
            if (!dragging) return;
            var x = e.touches ? e.touches[0].clientX : e.clientX;
            setValueFromClientX(x);
          }
          function onUp() {
            dragging = false;
            handle.classList.remove("is-dragging");
          }

          track.addEventListener("mousedown", onDown);
          track.addEventListener("touchstart", onDown, { passive: false });
          document.addEventListener("mousemove", onMove);
          document.addEventListener("touchmove", onMove, { passive: false });
          document.addEventListener("mouseup", onUp);
          document.addEventListener("touchend", onUp);

          decBtn.addEventListener("click", function () {
            value = clamp(parseFloat((value - 0.5).toFixed(2)), MIN_M, MAX_M);
            render();
          });
          incBtn.addEventListener("click", function () {
            value = clamp(parseFloat((value + 0.5).toFixed(2)), MIN_M, MAX_M);
            render();
          });

          track.addEventListener("keydown", function (e) {
            if (e.key === "ArrowLeft") {
              value = clamp(parseFloat((value - 0.5).toFixed(2)), MIN_M, MAX_M);
              render();
            }
            if (e.key === "ArrowRight") {
              value = clamp(parseFloat((value + 0.5).toFixed(2)), MIN_M, MAX_M);
              render();
            }
          });

          render();
        }

        function initAll() {
          var roots = document.querySelectorAll("[data-lgtv-root]");
          for (var i = 0; i < roots.length; i++) initInstance(roots[i]);
        }

        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", initAll);
        } else {
          initAll();
        }

        var attempts = 0;
        var retry = setInterval(function () {
          initAll();
          attempts++;
          if (attempts > 20) clearInterval(retry);
        }, 500);
      })();
    </script>
  </body>
</html>
